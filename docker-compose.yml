services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: powersight
      POSTGRES_USER: powersight
      POSTGRES_PASSWORD: powersight
    ports:
      - "5432:5432"
    volumes:
      - powersight-pg:/var/lib/postgresql/data

  dashboard:
    build: .
    environment:
      POWERSIGHT_DB: /app/data/powersight.db
      MQTT_HOST: mqtt-broker
      DATABASE_URL: postgresql://powersight:powersight@postgres:5432/powersight
    ports:
      - "8000:8000"
    volumes:
      - powersight-data:/app/data
    depends_on:
      - mqtt-broker
      - postgres

volumes:
  powersight-data:
  powersight-pg:
