[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powersight-analytics"
version = "1.0.0"
description = "Smart building energy analytics and power quality platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.9",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "paho-mqtt>=2.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
